services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: semanticfeed
      POSTGRES_PASSWORD: semanticfeed
      POSTGRES_DB: semanticfeed
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semanticfeed -d semanticfeed"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
